name: department-contest-local

x-environment: &environment
  DEBUG: "1"
  HTTPS: "0"
  ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
  CSRF_TRUSTED_ORIGINS: http://localhost:${PORT:-8080},http://127.0.0.1:${PORT:-8080}
  DATABASE_PATH: /data/db.sqlite3
  STATIC_ROOT: /app/staticfiles
  WORKER_LOCK: /data/worker.lock
  JUDGE_IMAGE: contest-judge:local
  JUDGE_PREFIX: ${JUDGE_PREFIX:-department-contest-local-judge}
  LOGIN_TRUST_PROXY: "1"

services:
  init:
    build:
      context: .
      target: web
    environment: *environment
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py configure_sqlite && python manage.py collectstatic --noinput"]
    volumes:
      - database:/data
      - staticfiles:/app/staticfiles
    read_only: true
    tmpfs: [/tmp]

  web:
    build:
      context: .
      target: web
    environment: *environment
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - database:/data
      - staticfiles:/app/staticfiles:ro
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    environment: *environment
    depends_on:
      init:
        condition: service_completed_successfully
      judge-image:
        condition: service_completed_successfully
    volumes:
      - database:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add: ["${DOCKER_GID:?Set DOCKER_GID to the host Docker socket group}"]
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    stop_grace_period: 60s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ":80"
    ports: ["127.0.0.1:${PORT:-8080}:80"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - staticfiles:/srv/static:ro
    tmpfs: [/data, /config]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  judge-image:
    build: ./judge
    image: contest-judge:local
    pull_policy: build
    entrypoint: ["true"]

volumes:
  database:
  staticfiles:
