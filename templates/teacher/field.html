<div class="form-field {% if field.errors %}has-error{% endif %}">{% if field.widget_type == 'checkbox' %}<label class="checkbox-label" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>{% else %}{{ field.label_tag }}{{ field }}{% endif %}{% if field.help_text %}<p class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}{{ field.errors }}</div>
